name: upstream-sync-issue

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  file-sync-issue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "Pull from upstream: merge Nokia-Bell-Labs main"
    steps:
      - name: Create sync issue unless one is already open
        run: |
          open_count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number --jq 'length')
          if [ "$open_count" -gt 0 ]; then
            echo "An open sync issue already exists; not creating a duplicate."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --label enhancement \
            --body-file - <<'BODY'
          ## Description

          Weekly reminder to pull maintenance fixes from upstream
          (Nokia-Bell-Labs/declarative-agents) into this fork's main.

          ## Steps

          From the main checkout, on a branch (never commit to main directly):

          ```bash
          git fetch upstream
          git checkout -b gh-<this-issue>-upstream-sync main
          git merge upstream/main
          git push -u origin gh-<this-issue>-upstream-sync
          ```

          Then open a PR into main titled "GH-<this-issue>: Pull from upstream",
          resolve any conflicts in favor of fork functionality, and merge. If
          upstream has no new commits, close this issue with a comment saying so.

          ## Recurrence

          Filed automatically by .github/workflows/upstream-sync-issue.yml
          (weekly, Monday 09:00 UTC). It skips creation while a same-titled
          issue is open.
          BODY
