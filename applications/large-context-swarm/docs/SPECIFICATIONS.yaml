id: large-context-swarm-specifications
title: Large Context Swarm Specification Index

overview: |
  This index covers the governance corpus for the large context swarm and the
  release 01.0 specification set. Four releases are planned; 01.0 is specified.
  Its SRD, use case, and test suite are the contract the profiles and the
  integration evidence implement.

  Shared application requirements and catalog family requirements stay external.
  Local documents cite them and define only this application's loop, its actor
  boundaries, and its evidence.

