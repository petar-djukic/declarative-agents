id: large-context-swarm-specifications
title: Large Context Swarm Specification Index

overview: |
  This index covers the governance corpus for the large context swarm. Four
  releases are planned; none is specified yet. The release 01.0 SRD, use case,
  and test suite are the next documents to land, and they are what the profiles
  and the integration evidence implement.

  Shared application requirements and catalog family requirements stay external.
  Local documents cite them and define only this application's loop, its actor
  boundaries, and its evidence.

