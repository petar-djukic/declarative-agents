external_references:
  note: |
    These requirements are owned elsewhere. This application cites them and
    consumes their behavior; it does not restate or fork them.
  requirements:
    - id: srd001-application-module-contract
      owner: applications/docs
      summary: Baseline runnable-module obligations — canonical references, local documents, root orchestration participation, ownership-aware agent accounting.
    - id: srd003-application-consistency
      owner: applications/docs
      summary: Manifest as composition authority, README shape, and the status vocabulary this corpus uses.
    - id: srd023-blackboard-memory
      owner: applications/catalog
      summary: Named collections, provenance metadata on writes, metadata and exact-substring query filters, and the memory-write block this application's workers use.
    - id: srd012-chroma-corpus-agents
      owner: applications/catalog
      summary: The Chroma corpus family, its REST vocabulary, and the provider-embedding threading contract the blackboard inherits.

coverage_gaps: |
  Every release is planned and nothing is specified, so the corpus currently
  states intent and boundaries only. The concrete gaps, in the order they close:

  Release 01.0 has no SRD, use case, or test suite. Until they exist there is no
  contract for the root and worker machines, and the handle-discipline invariant
  is prose in the vision rather than a numbered requirement with a test case.

  The module is not registered at root, so it does not yet participate in root
  audit, test, stats, or release orchestration, and it owns no manifest. Until
  registration lands, the classification in this corpus is a claim about a
  directory rather than a checked status.

  Releases 02.0 through 04.0 name their SRDs by identifier only. Those
  identifiers are reserved, not written, and the road-map entries are the only
  description of their scope.
