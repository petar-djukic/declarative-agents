rest:
  version: v1
  auth:
    none:
      type: none
  limits:
    local_corpus:
      timeout: 30s
      read_timeout: 30s
      max_request_bytes: 1048576
      max_response_bytes: 1048576
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts: [127.0.0.1]
        ports: [8000, 11434]
  clients:
    ollama:
      base_url: http://127.0.0.1:11434
      auth_ref: none
      limits_ref: local_corpus
      operations:
        version:
          method: GET
          path: /api/version
          params:
            body_source: none
          success: {status: [200], signal: OllamaReady}
          response:
            output:
              version: $.version
          side_effects:
            - kind: external_api
              target: ollama.version
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
        embed:
          method: POST
          path: /api/embeddings
          params:
            body_schema:
              type: object
              required: [input]
              properties:
                input: {type: string}
                id: {type: string}
            body_source: previous_result
            input_mapping:
              input: $.raw
              id: $.path
            carry_forward: [input, id]
          body:
            model: qwen3-embedding:8b
            prompt: "{{ params.input }}"
          success: {status: [200], signal: DocumentEmbedded}
          response:
            output:
              embedding: $.embedding
          side_effects:
            - kind: external_api
              target: ollama.embeddings
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
        embed_query:
          method: POST
          path: /api/embeddings
          params:
            body_source: previous_result
            input_mapping: {}
          body:
            model: qwen3-embedding:8b
            prompt: "What does this corpus describe?"
          success: {status: [200], signal: QueryEmbedded}
          response:
            output:
              embedding: $.embedding
          side_effects:
            - kind: external_api
              target: ollama.embeddings
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
        embed_memory:
          method: POST
          path: /api/embeddings
          params:
            body_schema:
              type: object
              required: [content, id, collection, source, agent, round]
              properties:
                content: {type: string}
                id: {type: string}
                collection: {type: string}
                source: {type: string}
                agent: {type: string}
                round: {type: integer}
            body_source: previous_result
            input_mapping:
              content: $.content
              id: $.id
              collection: $.collection
              source: $.source
              agent: $.agent
              round: $.round
            carry_forward: [content, id, collection, source, agent, round]
          body:
            model: qwen3-embedding:8b
            prompt: "{{ params.content }}"
          success: {status: [200], signal: MemoryEmbedded}
          response:
            output:
              embedding: $.embedding
          side_effects:
            - kind: external_api
              target: ollama.embeddings
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
    chroma:
      base_url: http://127.0.0.1:8000
      auth_ref: none
      limits_ref: local_corpus
      operations:
        heartbeat:
          method: GET
          path: /api/v2/heartbeat
          params:
            body_source: none
          success: {status: [200], signal: ChromaReady}
          side_effects:
            - kind: external_api
              target: chroma.heartbeat
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
        create_or_get_collection_carry:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections
          params:
            body_schema:
              type: object
              required: [embeddings, documents, ids]
              properties:
                embeddings: {type: array}
                documents: {type: string}
                ids: {type: string}
            body_source: previous_result
            input_mapping:
              embeddings: $.mapped.embedding
              documents: $.carried.input
              ids: $.carried.id
            carry_forward: [embeddings, documents, ids]
          body:
            name: corpus
            get_or_create: true
          success: {status: [200, 201], signal: CollectionReady}
          response:
            output:
              collection_id: $.id
          side_effects:
            - kind: external_api
              target: chroma.collection
              state: collection_upserted
          reversibility:
            classification: reversible
            undo: noop
        create_or_get_collection:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections
          params:
            body_source: previous_result
            input_mapping: {}
          body:
            name: corpus
            get_or_create: true
          success: {status: [200, 201], signal: CollectionReady}
          response:
            output:
              collection_id: $.id
          side_effects:
            - kind: external_api
              target: chroma.collection
              state: collection_upserted
          reversibility:
            classification: reversible
            undo: noop
        add_records:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections/{collection}/add
          params:
            path:
              collection: {type: string}
            body_schema:
              type: object
              required: [embeddings, documents, ids]
              properties:
                embeddings: {type: array}
                documents: {type: string}
                ids: {type: string}
            body_source: previous_result
            input_mapping:
              collection: $.mapped.collection_id
              embeddings: $.carried.embeddings
              documents: $.carried.documents
              ids: $.carried.ids
          body:
            embeddings: ["{{ params.embeddings }}"]
            documents: ["{{ params.documents }}"]
            ids: ["{{ params.ids }}"]
          success: {status: [200, 201], signal: DocumentAdded}
          side_effects:
            - kind: external_api
              target: chroma.records
              state: records_added
          reversibility:
            classification: compensatable
            undo: delete_records
          compensation:
            operation: delete_records
            reason: Delete the inserted record IDs from the trusted collection.
        delete_records:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections/{collection}/delete
          params:
            path:
              collection: {type: string}
            body_schema:
              type: object
              required: [ids]
              properties:
                ids: {type: string}
          body:
            ids: ["{{ params.ids }}"]
          success: {status: [200], signal: DocumentDeleted}
          side_effects:
            - kind: external_api
              target: chroma.records
              state: records_deleted
          reversibility:
            classification: irreversible
            undo: irreversible
            requires_confirmation: true
        count_records:
          method: GET
          path: /api/v2/tenants/default_tenant/databases/default_database/collections/{collection}/count
          params:
            path:
              collection: {type: string}
            body_source: previous_result
            input_mapping:
              collection: $.mapped.collection_id
          success: {status: [200], signal: CountReady}
          side_effects:
            - kind: external_api
              target: chroma.count
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
        create_or_get_collection_named:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections
          params:
            body_schema:
              type: object
              required: [collection_name, embeddings, documents, ids, source, agent, round]
              properties:
                collection_name: {type: string}
                embeddings: {type: array}
                documents: {type: string}
                ids: {type: string}
                source: {type: string}
                agent: {type: string}
                round: {type: integer}
            body_source: previous_result
            input_mapping:
              collection_name: $.carried.collection
              embeddings: $.mapped.embedding
              documents: $.carried.content
              ids: $.carried.id
              source: $.carried.source
              agent: $.carried.agent
              round: $.carried.round
            carry_forward: [embeddings, documents, ids, source, agent, round]
          body:
            name: "{{ params.collection_name }}"
            get_or_create: true
          success: {status: [200, 201], signal: CollectionReady}
          response:
            output:
              collection_id: $.id
          side_effects:
            - kind: external_api
              target: chroma.collection
              state: collection_upserted
          reversibility:
            classification: reversible
            undo: noop
        add_records_tagged:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections/{collection}/add
          params:
            path:
              collection: {type: string}
            body_schema:
              type: object
              required: [embeddings, documents, ids, source, agent, round]
              properties:
                embeddings: {type: array}
                documents: {type: string}
                ids: {type: string}
                source: {type: string}
                agent: {type: string}
                round: {type: integer}
            body_source: previous_result
            input_mapping:
              collection: $.mapped.collection_id
              embeddings: $.carried.embeddings
              documents: $.carried.documents
              ids: $.carried.ids
              source: $.carried.source
              agent: $.carried.agent
              round: $.carried.round
            carry_forward: [ids]
          body:
            embeddings: ["{{ params.embeddings }}"]
            documents: ["{{ params.documents }}"]
            ids: ["{{ params.ids }}"]
            metadatas:
              - source: "{{ params.source }}"
                agent: "{{ params.agent }}"
                round: "{{ params.round }}"
          success: {status: [200, 201], signal: MemoryAdded}
          side_effects:
            - kind: external_api
              target: chroma.records
              state: records_added
          reversibility:
            classification: compensatable
            undo: delete_records
          compensation:
            operation: delete_records
            reason: Delete the written entry from the blackboard collection.
        create_or_get_collection_named_query:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections
          params:
            body_schema:
              type: object
              required: [collection_name, query_embeddings, where, where_document, n_results]
              properties:
                collection_name: {type: string}
                query_embeddings: {type: array}
                where: {type: object}
                where_document: {type: object}
                n_results: {type: integer}
            body_source: previous_result
            input_mapping:
              collection_name: $.carried.collection
              query_embeddings: $.mapped.embedding
              where: $.carried.where
              where_document: $.carried.where_document
              n_results: $.carried.n_results
            carry_forward: [query_embeddings, where, where_document, n_results]
          body:
            name: "{{ params.collection_name }}"
            get_or_create: true
          success: {status: [200, 201], signal: CollectionReady}
          response:
            output:
              collection_id: $.id
          side_effects:
            - kind: external_api
              target: chroma.collection
              state: collection_upserted
          reversibility:
            classification: reversible
            undo: noop
        query_records_filtered:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections/{collection}/query
          params:
            path:
              collection: {type: string}
            body_schema:
              type: object
              required: [query_embeddings, where, where_document, n_results]
              properties:
                query_embeddings: {type: array}
                where: {type: object}
                where_document: {type: object}
                n_results: {type: integer}
            body_source: previous_result
            input_mapping:
              collection: $.mapped.collection_id
              query_embeddings: $.carried.query_embeddings
              where: $.carried.where
              where_document: $.carried.where_document
              n_results: $.carried.n_results
          body:
            query_embeddings: ["{{ params.query_embeddings }}"]
            n_results: "{{ params.n_results }}"
            where: "{{ params.where }}"
            where_document: "{{ params.where_document }}"
          success: {status: [200], signal: QueryResponded}
          response:
            output:
              ids: $.ids
              documents: $.documents
              metadatas: $.metadatas
          side_effects:
            - kind: external_api
              target: chroma.query
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
        create_or_get_collection_query:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections
          params:
            body_schema:
              type: object
              required: [query_embeddings]
              properties:
                query_embeddings: {type: array}
            body_source: previous_result
            input_mapping:
              query_embeddings: $.mapped.embedding
            carry_forward: [query_embeddings]
          body:
            name: corpus
            get_or_create: true
          success: {status: [200, 201], signal: CollectionReady}
          response:
            output:
              collection_id: $.id
          side_effects:
            - kind: external_api
              target: chroma.collection
              state: collection_upserted
          reversibility:
            classification: reversible
            undo: noop
        query_records:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections/{collection}/query
          params:
            path:
              collection: {type: string}
            body_schema:
              type: object
              required: [query_embeddings]
              properties:
                query_embeddings: {type: array}
            body_source: previous_result
            input_mapping:
              collection: $.mapped.collection_id
              query_embeddings: $.carried.query_embeddings
          body:
            query_embeddings: ["{{ params.query_embeddings }}"]
            n_results: 5
          success: {status: [200], signal: QueryResponded}
          response:
            output:
              ids: $.ids
              documents: $.documents
          side_effects:
            - kind: external_api
              target: chroma.query
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
