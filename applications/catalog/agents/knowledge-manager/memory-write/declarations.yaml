tools:
  - name: embed_memory
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Embed the supplied entry at Ollama and carry the record and its provenance forward.
    problem: Chroma does not embed server-side, so the agent must compute the vector at a provider.
    goals:
      - Select the entry content, id, collection, and provenance from the request seed.
      - Return the embedding vector mapped from the Ollama response.
      - Carry the record fields forward for the collection and write words.
    requirements:
      input:
        - Runtime input is selected from the request seed through input_mapping.
      output:
        - Output includes the mapped embedding vector and the carried record fields.
      errors:
        - Network, timeout, schema, and mapping failures emit CommandError.
    non_goals:
      - Does not author or alter the embedding vector.
      - Does not read the entry from a file or accept a model-authored entry.
      - Does not accept runtime method, URL, host, or auth overrides.
    parameters:
      type: object
      properties:
        content: {type: string}
        id: {type: string}
        collection: {type: string}
        source: {type: string}
        agent: {type: string}
        round: {type: integer}
    emits: [MemoryEmbedded, CommandError]
    output:
      description: Mapped Ollama embedding with the carried record fields.
      schema:
        type: object
        properties:
          mapped: {type: object}
          carried: {type: object}
    side_effects:
      - kind: external_api
        target: ollama.embeddings
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Computing an embedding does not mutate state.
    errors:
      - signal: CommandError
        condition: The Ollama embeddings call fails on network, timeout, schema, or mapping.
        state_after_failure: No embedding is produced and no state changes.
    relationships:
      overlaps:
        - tool: rest_client_invoke
          difference: This profile-specific word binds the Ollama entry-embedding operation.
      before: [resolve_memory_collection]
    config:
      rest_ref: ollama
      operation: embed_memory

  - name: resolve_memory_collection
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Create-or-get the named blackboard collection and carry the tagged record forward.
    problem: Single-hop threading means the returned collection id must reach the write through this word.
    goals:
      - Create-or-get the collection the request named, with no server-side embedding function.
      - Resolve the returned collection id for the write path.
      - Carry the embedding, document, id, and provenance forward from the embed Result.
    requirements:
      input:
        - The collection name, embedding, document, id, and provenance are selected from the previous embed Result output.
      output:
        - Output includes the mapped collection id and the carried record fields.
      errors:
        - Network, timeout, schema, and mapping failures emit CommandError.
    non_goals:
      - Does not configure a server-side embedding function.
      - Does not accept runtime method, URL, host, or auth overrides.
    parameters:
      type: object
      properties:
        collection_name: {type: string}
        embeddings: {type: array}
        documents: {type: string}
        ids: {type: string}
        source: {type: string}
        agent: {type: string}
        round: {type: integer}
    emits: [CollectionReady, CommandError]
    output:
      description: Mapped Chroma collection id with the carried record fields.
      schema:
        type: object
        properties:
          mapped: {type: object}
          carried: {type: object}
    side_effects:
      - kind: external_api
        target: chroma.collection
        state: read_only
        description: Create-or-get is idempotent for a stable collection name, so
          the call leaves no net change to reverse.
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Create-or-get is idempotent for a stable collection name.
    errors:
      - signal: CommandError
        condition: The Chroma create-or-get collection call fails on network, timeout, schema, or mapping.
        state_after_failure: The collection id is unresolved; create-or-get is idempotent so there is no net change.
    relationships:
      overlaps:
        - tool: rest_client_invoke
          difference: This profile-specific word binds the named create-or-get collection operation for the blackboard write path.
      after: [embed_memory]
      before: [write_memory]
    config:
      rest_ref: chroma
      operation: create_or_get_collection_named

  - name: write_memory
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Write the tagged entry to the resolved collection and return its record id.
    problem: A blackboard entry is only useful to a reader if its provenance is stored with it.
    goals:
      - Thread the collection id, embedding, document, id, and provenance from the previous Result.
      - Store the record with its source, agent, and round metadata.
      - Carry the record id forward as the run's handle to the stored entry.
    requirements:
      input:
        - Collection id, embedding, document, id, and provenance are selected from the previous Result output.
      output:
        - Output reports operation identity, status, and the carried record id.
      errors:
        - Network, timeout, schema, and mapping failures emit CommandError.
    non_goals:
      - Does not author the embedding vector.
      - Does not return the stored content; the record id is the handle.
      - Does not accept runtime method, URL, host, or auth overrides.
    parameters:
      type: object
      properties:
        collection: {type: string}
        embeddings: {type: array}
        documents: {type: string}
        ids: {type: string}
        source: {type: string}
        agent: {type: string}
        round: {type: integer}
    emits: [MemoryAdded, CommandError]
    output:
      description: Mapped Chroma add result with the carried record id.
      schema:
        type: object
        properties:
          operation: {type: string}
          status: {type: integer}
          carried: {type: object}
    side_effects:
      - kind: external_api
        target: chroma.records
        state: records_added
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Delete the receipt-recorded record id from the blackboard collection.
      payload: boundary_compensation
      captures: [collection, ids, operation]
    errors:
      - signal: CommandError
        condition: The Chroma add call fails on network, timeout, schema, or mapping.
        state_after_failure: The entry is not stored in the collection.
    relationships:
      overlaps:
        - tool: rest_client_invoke
          difference: This profile-specific word binds the tagged add-records operation.
      after: [resolve_memory_collection]
    config:
      rest_ref: chroma
      operation: add_records_tagged
