id: srd023-blackboard-memory
title: Blackboard Memory Corpus Extensions

context: |
  The Chroma corpus family (srd012) reads and writes one collection whose name
  is a literal in the create-or-get body, adds records without metadata, and
  queries with a fixed result count and no filters. That shape serves a static
  document corpus with one reader.

  A blackboard is the same storage used as shared short-term memory: several
  agents write provenance-tagged entries into a per-task collection and read
  each other's entries back by vector similarity, by metadata, or by exact
  substring. The collection name identifies the task, the metadata identifies
  who wrote an entry and in which round, and the query filters let a reader
  select derived entries without pulling the whole corpus through a context
  window. Content stays behind handles: a write returns the record identifier
  and never echoes what it stored.

  This SRD owns the corpus-family extensions that make the blackboard usable.
  It adds vocabulary to the profile-owned REST declarations in
  agents/knowledge-manager/corpus-rest.yaml and one write-side block. The HTTP
  runtime and the previous-Result threading capability stay in agent-core, and
  the existing ingest and reader behavior stays exactly as srd012 specifies it.

problem: |
  Four properties are missing and each of them is a declaration change rather
  than a runtime change: the collection name is not a parameter, writes carry no
  provenance, queries cannot filter or size their result set, and there is no
  block that writes one piece of content on demand. Adding them to the existing
  operations in place would change the request bodies those operations already
  send, because the body renderer substitutes a missing declared parameter as a
  JSON null rather than omitting the key. The extensions therefore have to be
  additive, and the compatibility of the existing paths has to be a checkable
  criterion rather than an intention.

goals:
  - G1: Make the collection name a declared parameter so one corpus family serves per-task collections.
  - G2: Carry provenance on writes and let readers select on it.
  - G3: Add an on-demand write block that returns a record identifier and never echoes stored content.
  - G4: Leave the release 08.0 ingest and reader request bodies unchanged.

requirements:
  R1:
    title: Collection identity as a parameter
    items:
      - R1.1: The corpus REST vocabulary SHALL provide create-or-get collection words whose collection name comes from a declared param rendered into the request body, so the collection identity is chosen per invocation rather than fixed at authoring time.
      - R1.2: The parameterized words SHALL resolve the returned collection id into their Result output exactly as the release 08.0 words do, so the add and query paths thread identity unchanged.
      - R1.3: Because previous-Result threading is single-hop, each parameterized create-or-get word SHALL carry its inbound record or query payload forward alongside the resolved id, so the following write or query word threads both.
      - R1.4: The collection name SHALL NOT be authored by a model as free text where the profile fixes it; a profile that fixes the name SHALL supply it through the declaration and a profile that varies it per task SHALL thread it from the block's declared input.
  R2:
    title: Provenance metadata on writes
    items:
      - R2.1: The write path SHALL accept a metadata object per record and send it in the Chroma add request body alongside the embedding, document, and id.
      - R2.2: The provenance vocabulary SHALL be source (corpus for ingested documents, derived for agent-written entries), agent (the writing profile's identity), and round (the loop iteration that produced the entry).
      - R2.3: Metadata values SHALL be declared params threaded between boundary words, so no metadata field is read from an unvalidated response body.
  R3:
    title: Query filters and result count
    items:
      - R3.1: The query path SHALL accept a where object that filters on record metadata.
      - R3.2: The query path SHALL accept a where_document object that selects records by exact substring through the Chroma $contains operator, so a reader can find an entry by a literal identifier rather than by similarity alone.
      - R3.3: The query path SHALL accept the result count as a declared param rather than the literal 5 of the release 08.0 word.
      - R3.4: The filtered query word SHALL declare its filter and count params as required, because an absent declared param renders as a JSON null in the request body rather than being omitted, and Chroma rejects a null result count.
  R4:
    title: The memory-write block
    items:
      - R4.1: The knowledge-manager family SHALL ship a memory-write block with the profile, machine, tools, and declarations layout the corpus-ingest and corpus-reader blocks use.
      - R4.2: The memory-write machine SHALL sequence embedding the supplied content at the provider, resolving the target collection, and writing the tagged record, with terminal states for success and for a failed boundary word.
      - R4.3: The block SHALL take the content, the record id, the collection name, and the provenance fields as declared inputs, and SHALL NOT select the read tool or any discovery word; it writes what it is given.
      - R4.4: The block SHALL return the record identifier and SHALL NOT re-emit the stored content in its Result output. Because the Chroma add response body carries no identifier, the id SHALL reach the terminal Result through carry_forward on the write word.
      - R4.5: The embedding vector SHALL be machine-sequenced and threaded between boundary words, never authored by a model (srd012 R3.4).
  R5:
    title: Compatibility with the release 08.0 paths
    items:
      - R5.1: The create_or_get_collection, create_or_get_collection_carry, create_or_get_collection_query, add_records, and query_records operations SHALL keep their release 08.0 declarations, so the requests the ingest and reader machines send are byte-identical to the requests they send today.
      - R5.2: The corpus-ingest and corpus-reader blocks SHALL NOT change their machines, tool selections, or declarations.
      - R5.3: The chatbot-mesh rag-server and corpus-ingest wrappers SHALL NOT be modified; the mesh owns its own inline Chroma retrieval configuration.
      - R5.4: The extensions SHALL be additive operations and one additional block, and the compatibility of the unchanged operations SHALL be checkable by a conformance case rather than by inspection.

non_goals:
  - Change the agent-core HTTP runtime, the previous-Result threading capability, or the REST tool format.
  - Move Chroma retrieval authority out of the profile-owned REST declarations.
  - Add server-side embedding to Chroma or an embedding builtin word.
  - Specify the swarm that consumes the blackboard; the root and worker profiles belong to applications/large-context-swarm.
  - Define deletion, compaction, or retention for blackboard entries.

acceptance_criteria:
  - id: AC1
    criterion: The parameterized create-or-get words name the collection from a declared param, resolve the returned id, and carry the inbound payload forward for single-hop threading.
    traces: [R1.1, R1.2, R1.3, R1.4]
  - id: AC2
    criterion: The write path sends per-record metadata with the source, agent, and round vocabulary as declared threaded params.
    traces: [R2.1, R2.2, R2.3]
  - id: AC3
    criterion: The query path accepts a metadata filter, an exact $contains document filter, and a declared result count, each declared required so no filter renders as null.
    traces: [R3.1, R3.2, R3.3, R3.4]
  - id: AC4
    criterion: The memory-write block embeds, resolves, and writes a tagged record, returns the record id through carry_forward, and never re-emits the stored content.
    traces: [R4.1, R4.2, R4.3, R4.4, R4.5]
  - id: AC5
    criterion: The release 08.0 operations and blocks are unchanged and a conformance case proves the ingest and reader request bodies are unaffected.
    traces: [R5.1, R5.2, R5.3, R5.4]

