design_decisions:
  - id: D1
    decision: Extend the vocabulary with additional operations rather than adding optional params to the release 08.0 operations.
    reason: |
      The REST body renderer substitutes a declared param that was not supplied
      with its zero value, so an optional where or n_results renders as a JSON
      null in the request body instead of being omitted. Chroma rejects a null
      result count, and a null filter changes the query the reader sends today.
      Additive operations keep the existing bodies byte-identical and make R5
      provable by comparing declarations. The corpus REST file already uses this
      idiom: create_or_get_collection, create_or_get_collection_carry, and
      create_or_get_collection_query are three variants of one endpoint that
      differ only in their threading shape.
  - id: D2
    decision: The memory-write block returns the record id and never the stored content.
    reason: |
      The blackboard exists so that content does not travel through a root
      agent's context window. A write word that echoed its input would put the
      content back into the transcript that the collection was introduced to
      keep it out of.
  - id: D3
    decision: Provenance is a fixed three-field vocabulary rather than an open metadata map.
    reason: |
      Readers filter on these fields, so they have to agree on their names.
      source separates ingested documents from agent-derived entries, agent
      identifies the writer, and round orders the entries a loop produced.

